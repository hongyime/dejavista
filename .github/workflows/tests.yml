name: Tests

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "**.mjs"
      - "**.jsx"
      - "**.ts"
      - "**.tsx"
      - "tests/**"
      - "lib/**"
      - "api/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "**.js"
      - "**.mjs"
      - "**.jsx"
      - "**.ts"
      - "**.tsx"
      - "tests/**"
      - "lib/**"
      - "api/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
